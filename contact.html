<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Skills Training Centre - Contact Us</title>
</head>
<body>

    <div id="header">
        <h1>Future Skills Training Centre</h1>
    </div>

    <div id="navigation">
        <a href="index.html">Home</a> |
        <a href="about.html">About Us</a> |
        <a href="courses.html">Courses</a> |
        <a href="registration.html">Registration</a> |
        <a href="contact.html">Contact Us</a>
    </div>

    <hr>

    <div id="contact-details">
        <h2>Contact Us</h2>
        <p><strong>Address:</strong> Future Skills Training Centre, 123 Skills Avenue, Nairobi, Kenya</p>
        <p><strong>Telephone:</strong> +254 700 000 000</p>
        <p><strong>Email:</strong> <a href="mailto:info@futureskills.ac.ke">info@futureskills.ac.ke</a></p>
    </div>

    <div id="map">
        <h3>Our Location</h3>
        <img src="images/maps.png" alt="Map showing the location of Future Skills Training Centre" width="400">
    </div>

    <div id="contact-form">
        <h3>Send Us a Message</h3>

        <form action="#" method="post">
            <p>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name">
            </p>

            <p>
                <label for="contact-email">Email:</label><br>
                <input type="email" id="contact-email" name="email">
            </p>

            <p>
                <label for="subject">Subject:</label><br>
                <input type="text" id="subject" name="subject">
            </p>

            <p>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="40"></textarea>
            </p>

            <input type="submit" value="Submit">
        </form>
    </div>

    <hr>

    <div id="back">
        <p><a href="index.html">Back to Home</a></p>
    </div>

</body>
</html>
